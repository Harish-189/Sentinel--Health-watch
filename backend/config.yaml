# Sentinel thresholds and tunables. Code reads these via app.config; never hardcode them.

simulation:
  days: 730
  start_date: "2023-11-01"
  onset_day: 700          # scenario events start here; "now" = last day (729)
  seed: 42
  demo_seed: 7            # default seed for the UI/API demo (clear E1->E3 build-up and a projected bed breach)
  timeline_start: 694     # first as_of frame of the Command Center replay
  default_primary: D3     # Amberfield (center tile, 6 neighbors)

privacy:
  k_min: 5                # small-cell suppression threshold (counts below -> null + flag)
  laplace_enabled: false  # optional noise on displayed/exported small counts
  laplace_epsilon: 1.0
  pii_patterns:           # regex, matched case-insensitively against column + metric names
    - '(^|_)(first_?|last_?|full_?|patient_?|person_?)?name($|_)'
    - '(^|_)(patient|person|user|national|mrn|ssn)?_?id($|_)'
    - '(^|_)(dob|birth|birthdate|date_of_birth)($|_)'
    - 'address|street|postcode|zip'
    - 'phone|mobile_no|email'
    - 'ssn|aadhaar|passport|patient|person'
  allowlist: [district_id, evidence_id, run_id]

detection:
  train_guard_days: 45    # gap between training data and as-of day (keeps recent events out of the baseline)
  min_train_days: 180
  eval_window: 90         # days scored before as-of
  fourier_harmonics: 2
  outlier_mad: 3.5        # robust refit: drop training residuals beyond this many MADs
  z_threshold: 3.0
  consecutive_days: 2
  merge_gap_days: 2       # streaks separated by <= this many days form one anomaly episode
  ewma_lambda: 0.3
  ewma_L: 3.0
  cusum_k: 0.5
  cusum_h: 5.0
  min_sigma: 0.02         # floor on residual scale

gate:
  e1_z: 3.0
  e1_consecutive: 2
  e2_min_sources: 3
  lag_window_days: 10      # anomalies across sources must start within this window
  completeness_min: 0.90
  e3_persistence_days: 3
  e3_min_adjacent: 1       # >=1 adjacent district also anomalous (=2 districts total)
  e3_residual_excess: 0.30
  holiday_explains_max: 0.70
  backlog_tests_z_max: 3.0 # tests_done must stay below this z for "positivity rising, tests stable"
  active_within_days: 21   # an anomaly belongs to the current signal if it was active this recently
  completeness_window: 14
  feed_window: 7           # days checked for missing (not suppressed) feed values
  holiday_window_days: 3   # excess within +-N days of a holiday is attributable to it
  holiday_ruled_out_max: 0.30
  reporting_align_days: 3  # a meta/schema change this close to signal onset explains a step
  weather_corr_min: 0.5
  seasonal_yoy_explains: 1.15  # observed within 15% of the same weeks last year -> seasonal
  seasonal_yoy_ruled_out: 1.30
  contradict_pos_z_max: 1.0    # recent lab positivity z below this after an earlier rise = contradiction

confidence:
  intercept: -5.0
  weights:
    independent_sources: 1.5
    mean_z: 1.5
    lag_consistency: 1.0
    spatial_coherence: 1.2
    persistence_days: 1.0
    confounder_residual: 3.0
  platt_a: 1.0             # Platt calibration, refit by the eval harness (Stage 5)
  platt_b: 0.0
  bootstrap_n: 200

forecast:
  n_sims: 1000
  horizon_days: 14
  los_mean_days: 5.0
  icu_los_mean_days: 8.0
  fit_days: 14
  icu_share: 0.10
  growth_clip: [-0.15, 0.25]
  intervention_growth_cut: 0.03
  intervention_delay_days: 2

llm:
  # Models come from env: ANTHROPIC_MODEL (default below), ANTHROPIC_MODEL_FAST. Mode: LLM_MODE=auto|online|offline
  default_model: claude-opus-5-5
  default_fast_model: claude-haiku-5-5
  max_calls_per_analysis: 4
  max_tokens: 8000
  timeout_s: 45
  effort: low              # Opus 5.5 cannot disable thinking; effort is the cost lever
  critic_effort: low
  verifier_llm_critic: true
  tool_rounds_max: 2
  prompt_version: v1       # bump to invalidate the result cache
  number_rel_tol: 0.05
  number_abs_tol: 0.011
  pricing:                 # USD per 1M tokens: [input, output, cache_read]
    claude-opus-5-5: [4.0, 20.0, 0.20]
    claude-haiku-5-5: [0.10, 0.50, 0.01]
